spring.application.name=swish

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swish}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

swish.security.username=${SWISH_SECURITY_USERNAME}
swish.security.password=${SWISH_SECURITY_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
server.tomcat.threads.max=50
server.port=${PORT:8080}
spring.cache.type=redis
spring.cache.cache-names=shots
spring.cache.redis.time-to-live=10m
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=300ms
management.health.redis.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
