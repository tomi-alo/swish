services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_NAME}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d ${SPRING_DATASOURCE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  swish:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SPRING_DATASOURCE_NAME}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SWISH_SECURITY_USERNAME: ${SWISH_SECURITY_USERNAME}
      SWISH_SECURITY_PASSWORD: ${SWISH_SECURITY_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"
    mem_limit: 450m

volumes:
  pgdata:

